# Logs: Loki (single binary, ephemeral) + Promtail. Promtail tolerates the app taint so it
# ships logs from the application pool too. Grafana (from the metrics stack) reads Loki.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: platform
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki-stack
    targetRevision: 2.10.3
    helm:
      releaseName: loki
      values: |
        loki:
          enabled: true
          fullnameOverride: loki
          nodeSelector:
            workload: management
          persistence:
            enabled: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
        promtail:
          enabled: true
          tolerations:
            - operator: Exists
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
        grafana:
          enabled: false
        prometheus:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
