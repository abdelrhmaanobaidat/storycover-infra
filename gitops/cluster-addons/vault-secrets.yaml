# VSO wiring: Argo applies these CRs, VSO reads Vault and writes K8s Secret gemini-api-key.
apiVersion: v1
kind: Namespace
metadata:
  name: storycover
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
  namespace: storycover
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  address: http://vault.vault.svc:8200
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: storycover
  namespace: storycover
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  vaultConnectionRef: vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: storycover
    serviceAccount: default
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: gemini
  namespace: storycover
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  vaultAuthRef: storycover
  mount: secret
  type: kv-v2
  path: storycover/gemini
  refreshAfter: 60s
  destination:
    name: gemini-api-key
    create: true
