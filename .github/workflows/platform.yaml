name: platform

on:
  pull_request:
    branches: [main, prod]
    paths:
      - 'terraform-platform/**'
      - '.github/workflows/platform.yaml'
  push:
    branches: [main, prod]
    paths:
      - 'terraform-platform/**'
      - '.github/workflows/platform.yaml'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to target
        type: choice
        options: [dev, prod]
        default: dev
      action:
        description: Terraform action to run
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read
  id-token: write

# In-cluster layer (Argo CD via Helm over Connect Gateway). Applied AFTER the infra root
# has created the cluster. Branches: config -> validate -> plan. Merges: + apply (gated).
defaults:
  run:
    working-directory: terraform-platform

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.cfg.outputs.env }}
      wif: ${{ steps.cfg.outputs.wif }}
      sa: ${{ steps.cfg.outputs.sa }}
    steps:
      - name: Resolve environment
        id: cfg
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
          else
            BRANCH="${{ github.base_ref || github.ref_name }}"
            [ "$BRANCH" = "prod" ] && ENV="prod" || ENV="dev"
          fi
          echo "env=$ENV" >> "$GITHUB_OUTPUT"
          if [ "$ENV" = "prod" ]; then
            echo "wif=projects/539914233785/locations/global/workloadIdentityPools/github-pool/providers/github-provider" >> "$GITHUB_OUTPUT"
            echo "sa=infra-ci@storycover-prod.iam.gserviceaccount.com" >> "$GITHUB_OUTPUT"
          else
            echo "wif=projects/87639016657/locations/global/workloadIdentityPools/github-pool/providers/github-provider" >> "$GITHUB_OUTPUT"
            echo "sa=infra-ci@storycover-dev.iam.gserviceaccount.com" >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color

  plan:
    needs: [config, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ needs.config.outputs.wif }}
          service_account: ${{ needs.config.outputs.sa }}
      - uses: hashicorp/setup-terraform@v3
      - name: Plan
        run: |
          terraform init -backend-config="envs/${{ needs.config.outputs.env }}.backend.hcl" -input=false
          terraform plan -var-file="envs/${{ needs.config.outputs.env }}.tfvars" -input=false -no-color

  apply:
    needs: [config, plan]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    runs-on: ubuntu-latest
    environment: ${{ needs.config.outputs.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ needs.config.outputs.wif }}
          service_account: ${{ needs.config.outputs.sa }}
      - uses: hashicorp/setup-terraform@v3
      - name: Apply
        run: |
          terraform init -backend-config="envs/${{ needs.config.outputs.env }}.backend.hcl" -input=false
          terraform apply -var-file="envs/${{ needs.config.outputs.env }}.tfvars" -input=false -auto-approve -no-color
